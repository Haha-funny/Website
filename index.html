<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Primary Meta Tags -->
  <title>hahafunny</title>
  <meta name="title" content="hahafunny">
  <meta name="description" content="Join my Community For R6 Accs, R6 Carries and Programs.">
  <meta name="theme-color" content="#060713">

  <!-- Open Graph / Discord Embed Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hahafunny.org/">
  <meta property="og:title" content="hahafunny">
  <meta property="og:description" content="Join my Community For R6 Accs, R6 Carries and Programs.">
  <meta property="og:image" content="assets/profile.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">

  <!-- Stylesheet (cache-busted query parameter) -->
  <link rel="stylesheet" href="css/style.css?v=20260915-4">
  <link rel="icon" type="image/png" href="assets/profile.png">

  <!-- Critical styles for guaranteed ambient glow rendering -->
  <style>
    body {
      background-color: var(--bg-canvas, #060713) !important;
      background-image: var(--ambient-grad, radial-gradient(ellipse 110% 70% at 50% 15%, rgba(124, 58, 237, 0.28) 0%, rgba(37, 99, 235, 0.16) 45%, transparent 80%)) !important;
      background-attachment: fixed !important;
    }
  </style>
</head>
<body>

  <!-- Single Unified Ambient Halo (Smooth, uniform, zero scattered spots) -->
  <div class="ambient-glow-wrapper" aria-hidden="true">
    <div class="ambient-glow-core"></div>
  </div>

  <main class="container">
    <div class="profile-card">

      <!-- ==========================================================
           1. PROFILE PICTURE
           ========================================================== -->
      <div class="avatar-wrapper">
        <img 
          src="assets/profile.png" 
          alt=".hahafunny avatar" 
          class="avatar-image"
          width="112"
          height="112"
        >
        <span class="status-indicator" title="Online"></span>
      </div>

      <!-- ==========================================================
           2. USERNAME & HANDLE
           Default: shows only username (.hahafunny)
           Hover: spells out 'click to copy' in thick font
           ========================================================== -->
      <h1 class="display-name">hahafunny</h1>

      <button 
        type="button" 
        class="discord-handle" 
        id="discordHandleBtn" 
        title="Click to copy Discord username"
        aria-label="Copy Discord username .hahafunny"
      >
        <!-- Discord Logo SVG -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span class="handle-text" id="handleText">.hahafunny</span>
      </button>

      <!-- ==========================================================
           3. SHORT BIO / TAGLINE
           ========================================================== -->
      <section class="bio-section">
        <p>Join my Community For R6 Accs, R6 Carries and Programs.</p>
      </section>

      <!-- ==========================================================
           4. PRIMARY ACTION BUTTON: JOIN DISCORD
           ========================================================== -->
      <div class="actions">
        <a 
          href="https://discord.gg/38FWDppfva" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn-discord"
        >
          <!-- Discord Logo SVG -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span>Join my Discord</span>
        </a>
      </div>

    </div>

    <!-- Theme Switcher: Explore Blue & Purple vs Black & Teal -->
    <div class="theme-selector" role="group" aria-label="Select background theme">
      <span class="theme-label">Style:</span>
      <button type="button" class="theme-chip active" id="btnThemePurple" aria-pressed="true">
        <span class="chip-color chip-purple-blue"></span> Blue &amp; Purple
      </button>
      <button type="button" class="theme-chip" id="btnThemeTeal" aria-pressed="false">
        <span class="chip-color chip-teal"></span> Black &amp; Teal
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; <span id="year"></span> <a href="https://hahafunny.org">hahafunny.org</a></p>
    </footer>
  </main>

  <!-- Feedback Toast for copying username -->
  <div class="toast" id="toast" role="status" aria-live="polite">Copied username to clipboard!</div>

  <!-- Interactive JavaScript -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const handleBtn = document.getElementById('discordHandleBtn');
    const handleText = document.getElementById('handleText');
    const toast = document.getElementById('toast');
    let toastTimeout;

    // Hover effect: spells out 'click to copy' in thick font
    handleBtn.addEventListener('mouseenter', () => {
      handleText.textContent = 'click to copy';
      handleText.classList.add('thick-text');
    });

    // Mouse leave: reverts to '.hahafunny'
    handleBtn.addEventListener('mouseleave', () => {
      handleText.textContent = '.hahafunny';
      handleText.classList.remove('thick-text');
    });

    // Copy to clipboard
    handleBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('.hahafunny');
        handleText.textContent = 'copied!';
        handleText.classList.add('thick-text');
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
          if (handleBtn.matches(':hover')) {
            handleText.textContent = 'click to copy';
          } else {
            handleText.textContent = '.hahafunny';
            handleText.classList.remove('thick-text');
          }
        }, 1800);
      } catch (err) {
        console.error('Failed to copy text: ', err);
      }
    });

    // Theme Switcher Logic (Blue & Purple vs Black & Teal)
    const btnPurple = document.getElementById('btnThemePurple');
    const btnTeal = document.getElementById('btnThemeTeal');

    function setTheme(theme) {
      if (theme === 'teal') {
        document.body.classList.add('theme-teal');
        btnTeal.classList.add('active');
        btnTeal.setAttribute('aria-pressed', 'true');
        btnPurple.classList.remove('active');
        btnPurple.setAttribute('aria-pressed', 'false');
      } else {
        document.body.classList.remove('theme-teal');
        btnPurple.classList.add('active');
        btnPurple.setAttribute('aria-pressed', 'true');
        btnTeal.classList.remove('active');
        btnTeal.setAttribute('aria-pressed', 'false');
      }
      try { localStorage.setItem('hhf_bg_theme', theme); } catch(e) {}
    }

    btnPurple.addEventListener('click', () => setTheme('purple'));
    btnTeal.addEventListener('click', () => setTheme('teal'));

    // Restore saved user choice if set
    try {
      const savedTheme = localStorage.getItem('hhf_bg_theme');
      if (savedTheme) setTheme(savedTheme);
    } catch(e) {}
  </script>
</body>
</html>
